<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>KHSAE TEI</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      background: #14151a;
      color: #eaeaea;
      margin: 0;
      padding: 24px;
    }
    h1 { font-size: 18px; margin: 0 0 16px; color: #f5c542; }
    .box {
      background: #1e2027;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .label { font-size: 12px; color: #999; text-transform: uppercase; }
    .value { font-size: 20px; margin: 4px 0 12px; }
    .code { font-size: 32px; letter-spacing: 4px; font-weight: bold; color: #f5c542; }
    button {
      background: #2c2f3a;
      color: #eaeaea;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
    }
    button:hover { background: #383c4a; }
    #log {
      font-family: monospace;
      font-size: 12px;
      background: #0e0f13;
      border-radius: 6px;
      padding: 8px;
      height: 160px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>ខ្សែតី KHSAE TEI</h1>
  <div class="box">
    <div class="label">Desktop address</div>
    <div class="value" id="address">loading...</div>
    <div class="label">Pairing code</div>
    <div class="code" id="code">------</div>
    <button id="regen">New Code</button>
    <div style="margin-top: 12px;">
      <img id="qr" width="160" height="160" style="background:#fff; border-radius:4px;" />
    </div>
  </div>
  <div class="box">
    <div class="label">Events</div>
    <div id="log"></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
